<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f1f2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Finances">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Mes Finances</title>
<style>
/* Site autonome (GitHub Pages, écran d'accueil iPhone) : laisse la place à l'heure et à la Dynamic Island,
   et masque le contenu qui défile derrière la barre d'état. */
.app { padding-top: calc(env(safe-area-inset-top, 0px) + 8px) !important; }
body::before { content: ""; position: fixed; z-index: 45; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); }
/* Chaque page occupe au moins tout l'écran : sinon, sur une page courte, iOS décale la barre d'onglets
   et le bouton + vers le haut. */
html { min-height: 100%; }
body, .app { min-height: 100vh; min-height: 100lvh; }
</style>
<style>
/* Mise en page : application mobile (iPhone) — grand titre, contenu en cartes, barre d'onglets fixe en bas, panneaux qui montent du bas. */
:root {
  color-scheme: light;
  --bg: #f1f2f6; --surface: #ffffff; --surface-2: #e8eaf0; --border: #dcdfe7;
  --text: #15181f; --muted: #6b7180; --accent: #4b56d2; --accent-soft: #e6e8fb; --on-accent: #ffffff;
  --pos: #1c9a52; --neg: #d33f3f; --warn: #c7860a; --backdrop: rgba(10, 12, 20, .42);
  --tabbar: rgba(255, 255, 255, .86);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, sans-serif;
  --r: 18px; --tab-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0c10; --surface: #17191f; --surface-2: #23262f; --border: #2c303b;
    --text: #eef0f5; --muted: #949aa8; --accent: #8a93ff; --accent-soft: #23264a; --on-accent: #0b0c10;
    --pos: #3fd07f; --neg: #ff6b6b; --warn: #f2b53c; --backdrop: rgba(0, 0, 0, .6);
    --tabbar: rgba(23, 25, 31, .86);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0c10; --surface: #17191f; --surface-2: #23262f; --border: #2c303b;
  --text: #eef0f5; --muted: #949aa8; --accent: #8a93ff; --accent-soft: #23264a; --on-accent: #0b0c10;
  --pos: #3fd07f; --neg: #ff6b6b; --warn: #f2b53c; --backdrop: rgba(0, 0, 0, .6);
  --tabbar: rgba(23, 25, 31, .86);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.4 var(--font); touch-action: manipulation; }
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
input, select { font: inherit; font-size: 17px; color: var(--text); }
.hidden { display: none !important; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); } .muted { color: var(--muted); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---- structure ---- */
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(var(--tab-h) + 96px + env(safe-area-inset-bottom, 0px)); }
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 12px 2px 14px; }
.topbar h1 { font: 700 34px/1.1 var(--font-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding-bottom: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"]::before { background: var(--pos); }
.sync[data-s="busy"]::before { background: var(--warn); }
.sync[data-s="error"]::before { background: var(--neg); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; min-width: 0; }
.card h2, .section-title { font: 600 13px/1.2 var(--font); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
.section-title { margin: 10px 4px -4px; display: flex; justify-content: space-between; align-items: baseline; }
.section-title button { background: none; border: 0; color: var(--accent); font-size: 15px; text-transform: none; letter-spacing: 0; font-weight: 500; padding: 4px; cursor: pointer; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* ---- sélecteur de mois ---- */
.monthbar { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 14px; padding: 4px; }
.monthbar span { font-weight: 600; text-transform: capitalize; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: none; color: var(--accent); font-size: 26px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:active { background: var(--surface-2); }

/* ---- grands chiffres ---- */
.big { font: 700 40px/1.05 var(--font-num); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mid { font: 650 22px/1.15 var(--font-num); font-variant-numeric: tabular-nums; }
.label { font-size: 13px; color: var(--muted); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.split > div { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; min-width: 0; }

/* ---- listes ---- */
.list { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 16px; background: none; border: 0; text-align: left; cursor: pointer; position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; border-top: 1px solid var(--border); }
.item:active { background: var(--surface-2); }
a.item { color: inherit; }
.item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-amt { font: 600 17px var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { color: var(--muted); font-size: 20px; margin-left: -4px; }
.avatar { width: 38px; height: 38px; flex: none; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
.day-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 14px 6px 6px; }
.rec { font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 8px; background: var(--surface-2); color: var(--muted); white-space: nowrap; vertical-align: middle; }
.chip-status { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.chip-status.ok { color: var(--pos); background: color-mix(in srgb, var(--pos) 14%, transparent); }
.chip-status.fast { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.chip-status.full { color: var(--muted); background: var(--surface-2); }
.chip-status.over { color: var(--neg); background: color-mix(in srgb, var(--neg) 14%, transparent); }
.empty { color: var(--muted); text-align: center; padding: 28px 16px; }

/* ---- barres de progression ---- */
.bar { position: relative; height: 10px; border-radius: 6px; background: var(--surface-2); overflow: visible; }
.bar > .fill { height: 100%; border-radius: 6px; max-width: 100%; }
.bar > .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--text); opacity: .55; transform: translateX(-1px); }
.budget-item { display: block; width: 100%; background: none; border: 0; text-align: left; padding: 14px 16px; cursor: pointer; position: relative; }
.budget-item + .budget-item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--border); }
.budget-item:active { background: var(--surface-2); }
.budget-item .row { margin-bottom: 10px; }
.budget-foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 8px; }

/* ---- boutons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--surface-2); color: var(--text); font-weight: 600; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.block { width: 100%; }
.btn.danger { color: var(--neg); }
.btn:disabled { opacity: .5; }
.btn:active { filter: brightness(.94); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 140px; }
.link-btn { background: none; border: 0; color: var(--accent); font-size: 17px; padding: 10px 4px; cursor: pointer; }
.link-btn.strong { font-weight: 700; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

/* ---- bouton + flottant ---- */
.fab { position: fixed; z-index: 30; right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 30px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 34px; line-height: 1; box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; }
.fab:active { transform: scale(.96); }

/* ---- barre d'onglets ---- */
.tabbar { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; background: var(--tabbar); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tab-h); }
.tabbar button { border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; cursor: pointer; }
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button.active { color: var(--accent); }

/* ---- panneaux (bottom sheets) ---- */
.backdrop { position: fixed; inset: 0; z-index: 50; background: var(--backdrop); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 16px); overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 22px 22px 0 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { position: sticky; top: 0; z-index: 1; background: var(--bg); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 0 10px; }
.sheet-head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 38px; height: 5px; border-radius: 3px; background: var(--border); transform: translateX(-50%); }
.sheet-head strong { font-size: 17px; padding-top: 10px; }
.sheet-head .link-btn { padding-top: 18px; }
.sheet-head > :first-child { justify-self: start; }
.sheet-head > :last-child { justify-self: end; }
.sheet .stack { gap: 16px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 38px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.amount-field { display: flex; align-items: baseline; justify-content: center; gap: 6px; background: var(--surface); border-radius: var(--r); padding: 16px; }
.amount-field input { width: 100%; min-width: 0; border: 0; background: none; text-align: right; font: 700 44px/1.1 var(--font-num); letter-spacing: -.02em; padding: 0; outline: none; }
.amount-field span { font: 700 34px var(--font-num); color: var(--muted); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.cat-chip { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; border: 2px solid transparent; background: var(--surface); font-size: 13px; font-weight: 500; cursor: pointer; min-width: 0; }
.cat-chip span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-chip.on { border-color: var(--accent); background: var(--accent-soft); }
.form { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.field { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 16px; position: relative; }
.field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--border); }
.field > span { flex: none; min-width: 92px; }
.field > span.grow { flex: 1; }
.field input:not([type=checkbox]), .field select { flex: 1; min-width: 0; border: 0; background: none; text-align: right; padding: 8px 0; outline: none; }
.field input[type=date] { min-height: 36px; }
.field input[type=color] { flex: none; width: 44px; height: 32px; padding: 0; border: 0; background: none; margin-left: auto; }
.switch { appearance: none; -webkit-appearance: none; margin-left: auto; width: 51px; height: 31px; border-radius: 16px; background: var(--surface-2); position: relative; cursor: pointer; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.switch:checked { background: var(--pos); }
.switch:checked::after { transform: translateX(20px); }
.hint { font-size: 13px; color: var(--muted); margin: -6px 6px 0; }
.suggests { display: flex; flex-wrap: wrap; gap: 8px; }
.suggests button { border: 0; background: var(--surface); border-radius: 999px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
.suggests button b { font-family: var(--font-num); }

/* ---- dialogue de confirmation et toast ---- */
.dialog-bg { position: fixed; inset: 0; z-index: 60; background: var(--backdrop); display: flex; align-items: center; justify-content: center; padding: 24px; }
.dialog { width: 100%; max-width: 320px; background: var(--surface); border-radius: 16px; overflow: hidden; text-align: center; }
.dialog p { margin: 0; padding: 20px 18px; font-size: 16px; }
.dialog button { display: block; width: 100%; min-height: 48px; border: 0; border-top: 1px solid var(--border); background: none; font-size: 17px; color: var(--accent); cursor: pointer; }
.dialog button.destructive { color: var(--neg); font-weight: 600; }
.toast { position: fixed; z-index: 70; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; }
.toast.show { opacity: 1; }

/* ---- graphiques ---- */
svg text { fill: var(--muted); font-family: var(--font); }
.legend { display: flex; flex-direction: column; gap: 8px; font-size: 15px; margin-top: 12px; }
.legend div { display: flex; justify-content: space-between; gap: 10px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
.ring-wrap { display: flex; align-items: center; gap: 18px; }
.ring-wrap .ring { flex: none; position: relative; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; padding: 3px 0; }
.kv b { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---- bandeaux d'action (à classer, sauvegarde, bilan) ---- */
.notice { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; cursor: pointer; background: var(--accent-soft); color: var(--text); border-radius: var(--r); padding: 14px 16px; }
.notice b { display: block; }
.notice .label { color: var(--muted); }
.notice.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.rank { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 15px; }
.rank:first-of-type { border-top: 0; }
.rank span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank b { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---- changement de mois par glissement ---- */
@keyframes from-right { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes from-left { from { transform: translateX(-28px); opacity: .4; } to { transform: none; opacity: 1; } }
.slide-next { animation: from-right .2s ease-out; }
.slide-prev { animation: from-left .2s ease-out; }
@media (prefers-reduced-motion: reduce) { .slide-next, .slide-prev { animation: none; } }

/* ---- écran de verrouillage ---- */
.lock { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: calc(env(safe-area-inset-top, 0px) + 20px) 24px calc(env(safe-area-inset-bottom, 0px) + 20px); }
.lock h2 { margin: 0; font: 600 20px var(--font-display); text-align: center; }
.lock .lock-msg { min-height: 20px; font-size: 15px; color: var(--muted); text-align: center; }
.lock .lock-msg.err { color: var(--neg); }
.dots { display: flex; gap: 18px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--text); }
.dots i.on { background: var(--text); }
.dots.shake { animation: shake .35s; }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 26px; }
.keypad button { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--surface); font: 500 30px var(--font-num); cursor: pointer; }
.keypad button:active { background: var(--surface-2); }
.keypad button.ghost { background: none; font-size: 15px; color: var(--accent); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><h1 id="viewTitle">Accueil</h1><span class="sync" id="syncStatus" data-s="local">Sur cet appareil</span></header>
  <main>
    <section id="view-home" class="stack"></section>
    <section id="view-ops" class="stack hidden"></section>
    <section id="view-budget" class="stack hidden"></section>
    <section id="view-goals" class="stack hidden"></section>
    <section id="view-settings" class="stack hidden"></section>
  </main>
</div>
<button class="fab" id="fab" data-action="addTx" aria-label="Ajouter une opération">+</button>
<div class="tabbar"><nav id="tabs"></nav></div>
<div class="backdrop hidden" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="dialog-bg hidden" id="dialogBg"><div class="dialog" role="alertdialog" aria-modal="true"><p id="dialogMsg"></p><button id="dialogYes" class="destructive"></button><button id="dialogNo"></button></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="lock hidden" id="lock" role="dialog" aria-modal="true" aria-label="Code de l'application"></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileCsv" accept=".pdf,.csv,application/pdf,text/csv" hidden>

<script>
(() => {
'use strict';
const STORE_KEY = 'mes-finances-v1';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const eur = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
const eur0 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fmt = n => eur.format(n || 0);
const fmt0 = n => eur0.format(Math.round(n || 0));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const monthKey = d => d.slice(0, 7);
const MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const monthLabel = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); };
const shiftMonth = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; };
const daysIn = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const round2 = n => Math.round(n * 100) / 100;
const dayLabel = d => { const l = new Date(d + 'T00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); return l[0].toUpperCase() + l.slice(1); };

  ['Salaire', 'revenu', '#1c9a52'], ['Autres revenus', 'revenu', '#2aa39b'],

function freshState() {
  return {
    accounts: [{ id: uid(), name: 'Compte courant', initial: 0 }],
    categories: DEFAULT_CATEGORIES.map(([name, type, color]) => ({ id: uid(), name, type, color })),
    transactions: [], budgets: {}, goals: [], rules: [], recurring: [], theme: '', v: 2

let state;
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); state = raw ? JSON.parse(raw) : freshState(); }
  catch { state = freshState(); }
  if (normalize()) save();
}
function normalize() {
  if (!state || typeof state !== 'object') state = freshState();
  for (const k of ['accounts', 'categories', 'transactions', 'goals', 'rules', 'recurring']) if (!Array.isArray(state[k])) state[k] = [];
  if (!state.budgets || typeof state.budgets !== 'object') state.budgets = {};
  if (!state.accounts.length) state.accounts.push({ id: uid(), name: 'Compte courant', initial: 0 });
  const before = `${state.v}|${state.ownerName || ''}`;
  if (!state.ownerName) state.ownerName = guessOwnerName();
  // Version 2 : catégories Restaurants et Espèces, virements entre vos comptes reconnus.
  if (!(state.v >= 2)) {
    for (const [name, color] of [['Restaurants', '#e0563b'], ['Espèces', '#7d8f5a']])
      if (!state.categories.some(c => c.type === 'depense' && c.name === name)) state.categories.push({ id: uid(), name, type: 'depense', color });
    const idOf = n => state.categories.find(c => c.type === 'depense' && c.name === n)?.id;
    for (const t of state.transactions) {
      if (t.imported && t.type !== 'virement' && isInternalTransfer(t.note)) { toInternal(t); continue; }
      if (t.type !== 'depense') continue;
      const up = (t.note || '').toUpperCase(), cn = state.categories.find(c => c.id === t.categoryId)?.name;
      if ((cn === 'Loisirs' || cn === 'À classer') && RESTO_RE.test(up)) t.categoryId = idOf('Restaurants');
      else if (cn === 'À classer' && CASH_RE.test(up)) t.categoryId = idOf('Espèces');
    }
    state.v = 2;
  }
  return `${state.v}|${state.ownerName || ''}` !== before; // vrai si l'état a été mis à jour
}
// Nom du titulaire, déduit d'un compte bancaire du type « M THIBAUD NOE (BoursoBank) ».
const CIVIL = new Set(['M', 'MR', 'MME', 'MLLE', 'MONSIEUR', 'MADAME', 'MADEMOISELLE']);
function cleanHolder(raw) {
  const m = String(raw || '').toUpperCase().replace(/\s*\(.*\)\s*$/, '').trim().match(/^(M|MR|MME|MLLE|MONSIEUR|MADAME)\.? ([A-ZÀ-Ý' -]{3,})$/);
  return m && !/\b(OU|ET)\b/.test(m[2]) ? m[2].trim() : '';
}
function guessOwnerName() { for (const a of state.accounts) { const n = cleanHolder(a.name); if (n) return n; } return ''; }
const nameWords = s => String(s || '').toUpperCase().split(/[^A-ZÀ-Ý]+/).filter(w => w.length > 1 && !CIVIL.has(w));
// Un virement entre vos propres comptes (vers un livret, depuis un autre compte à votre nom…).
function isInternalTransfer(note) {
  const main = String(note || '').toUpperCase().split(' · ')[0];
  if (!/^(REJ )?VIR/.test(main)) return false;
  if (/VERSEMENT INITIAL|CREATION COMPTE|LIVRET|LDDS|\bLEP\b|\bPEL\b|\bCEL\b/.test(main)) return true;
  const own = nameWords(state.ownerName);
  if (own.length < 2 || /\b(OU|ET)\b/.test(main)) return false;
  const words = new Set(nameWords(main));
  return own.every(w => words.has(w));
}
// Transforme une dépense ou un revenu importé en virement, sans changer le solde du compte.
function toInternal(t) {
  const accId = t.importAcc || t.accountId;
  t.origType = t.origType || t.type; t.importAcc = accId;
  if (t.origType === 'revenu') { t.accountId = null; t.toAccountId = accId; } else { t.accountId = accId; t.toAccountId = null; }
  t.type = 'virement'; t.categoryId = null;
}

// Enregistrement : une copie locale dans le navigateur, et, quand la page est ouverte sur claude.ai,
// une copie privée dans votre compte (un document de réglages + un document par mois d'opérations).
let cloud = null, cloudUser = null, cloudTimer = null, writing = false, pending = false;
const lastWritten = new Map();
const settingsRef = () => cloud.doc(`data/users/${cloudUser}/settings`);
const monthsCol = () => settingsRef().collection('months');
function setSync(s) {
  const el = $('#syncStatus'); el.dataset.s = s;
  el.textContent = { local: 'Sur cet appareil', ok: 'Enregistré', busy: 'Enregistrement…', error: 'Non enregistré' }[s];
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { if (!cloud) toast('Impossible d\'enregistrer (stockage indisponible)'); }
  if (cloud) { setSync('busy'); clearTimeout(cloudTimer); cloudTimer = setTimeout(flush, 500); }
}
async function flush() {
  if (!cloud) return;
  if (writing) { pending = true; return; }
  writing = true;
  try {
    do {
      pending = false;
      const { transactions, ...settings } = state, months = {};
      for (const t of transactions) (months[monthKey(t.date)] ||= []).push(t);
      const sj = JSON.stringify(settings);
      if (lastWritten.get('') !== sj) { await settingsRef().set(settings); lastWritten.set('', sj); }
      const keys = new Set([...Object.keys(months), ...[...lastWritten.keys()].filter(k => k)]);
      for (const k of keys) {
        if (!months[k]) { await monthsCol().doc(k).delete(); lastWritten.delete(k); continue; }
        const j = JSON.stringify(months[k]);
        if (lastWritten.get(k) !== j) { await monthsCol().doc(k).set({ tx: months[k] }); lastWritten.set(k, j); }
      }
    } while (pending);
    setSync('ok');
  } catch (e) {
    setSync('error');
    toast(e?.code === 'quota_exceeded' ? 'Espace de stockage plein : exportez puis supprimez d\'anciennes opérations' : 'Enregistrement impossible, vos données restent sur cet appareil');
  } finally { writing = false; }
}
async function connectCloud() {
  if (!window.claude?.use) return;
  const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  const id = u ? await u.id() : null;
  if (!d || !id) return;
  cloud = d; cloudUser = id; setSync('busy');
  try {
    const snap = await settingsRef().get();
    if (snap.exists) {
      const months = await monthsCol().limit(1000).get(), tx = [];
      for (const m of months.docs) { const arr = m.data().tx || []; tx.push(...arr); lastWritten.set(m.id, JSON.stringify(arr)); }
      lastWritten.set('', JSON.stringify(snap.data()));
      state = { ...structuredClone(snap.data()), transactions: structuredClone(tx) };
      const migrated = normalize();
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
      applyTheme(); applyRecurring(); render();
      setSync('ok');
      if (migrated) save();
    } else {
      await flush();
    }
  } catch { cloud = null; setSync('error'); toast('Votre compte ne répond pas, vos données restent sur cet appareil'); }
}

// ---- Opérations récurrentes : génère les occurrences manquantes jusqu'à aujourd'hui ----
function applyRecurring() {
  const nowKey = monthKey(today());
  let added = 0;
  for (const r of state.recurring) {
    let k = r.lastMonth ? shiftMonth(r.lastMonth, 1) : monthKey(r.startDate);
    while (k <= nowKey) {
      const date = `${k}-${pad2(Math.min(r.day, daysIn(k)))}`;
      if (date > today()) break;
      state.transactions.push({ ...r.template, id: uid(), date, recurringId: r.id });
      added++;
      r.lastMonth = k;
      k = shiftMonth(k, 1);
    }
  }
  if (added) { save(); toast(`${added} opération(s) récurrente(s) ajoutée(s)`); }
}

// ---- Calculs ----
function signed(t) { return t.type === 'revenu' ? t.amount : t.type === 'depense' ? -t.amount : 0; }
function accountBalance(a) {
  let b = Number(a.initial) || 0;
  for (const t of state.transactions) {
    if (t.type === 'virement') { if (t.accountId === a.id) b -= t.amount; if (t.toAccountId === a.id) b += t.amount; }
    else if (t.accountId === a.id) b += signed(t);
  }
  return round2(b);
}
function monthTotals(k) {
  let income = 0, expense = 0;
  for (const t of state.transactions) if (monthKey(t.date) === k) { if (t.type === 'revenu') income += t.amount; else if (t.type === 'depense') expense += t.amount; }
  return { income: round2(income), expense: round2(expense) };
}
function spentByCategory(k) {
  const m = {};
  for (const t of state.transactions) if (t.type === 'depense' && monthKey(t.date) === k) m[t.categoryId] = round2((m[t.categoryId] || 0) + t.amount);
  return m;
}
// Part du mois écoulée : 1 pour un mois passé, 0 pour un mois futur.
function monthProgress(k) {
  const now = monthKey(today());
  if (k < now) return 1;
  if (k > now) return 0;
  return Number(today().slice(8)) / daysIn(k);
}
function avgSpent(catId, k, n = 3) {
  let s = 0;
  for (let i = 1; i <= n; i++) s += spentByCategory(shiftMonth(k, -i))[catId] || 0;
  return round2(s / n);
}

    }
    a0 = a1;
  }

}

// ---- Bilan du mois ----
function monthReport(k) {
  const cur = monthTotals(k), prev = monthTotals(shiftMonth(k, -1));
  const exp = state.transactions.filter(t => t.type === 'depense' && monthKey(t.date) === k);
  const shops = {};
  for (const t of exp) { const n = merchantName(t.note) || cat(t.categoryId)?.name || 'Autre'; const key = n.toUpperCase(); (shops[key] ||= { name: n, count: 0, sum: 0 }); shops[key].count++; shops[key].sum = round2(shops[key].sum + t.amount); }
  const a = spentByCategory(k), b = spentByCategory(shiftMonth(k, -1));
  const changes = Object.keys({ ...a, ...b }).map(id => ({ c: cat(id), d: round2((a[id] || 0) - (b[id] || 0)) })).filter(x => x.c && Math.abs(x.d) >= 1).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 4);
  const subs = detectSubscriptions(k);
  return {
    cur, prev, count: exp.length,
    top: [...exp].sort((x, y) => y.amount - x.amount).slice(0, 5),
    shops: Object.values(shops).sort((x, y) => y.count - x.count || y.sum - x.sum).slice(0, 5),
    changes, subs, subsTotal: round2(subs.reduce((s, x) => s + x.amount, 0)),
  };
}
// Paiements réguliers : même enseigne, un paiement par mois sur au moins 2 des 3 derniers mois, montant stable.
function detectSubscriptions(k) {
  const months = [0, 1, 2].map(i => shiftMonth(k, -i)), by = {};
  for (const t of state.transactions) if (t.type === 'depense' && months.includes(monthKey(t.date))) {
    const n = merchantName(t.note); if (n) (by[n.toUpperCase()] ||= { name: n, list: [] }).list.push(t);
  }
  const subs = [];
  for (const { name, list } of Object.values(by)) {
    const ms = new Set(list.map(t => monthKey(t.date)));
    if (ms.size < 2 || ms.size !== list.length) continue;
    const avg = list.reduce((s, t) => s + t.amount, 0) / list.length;
    if (list.some(t => Math.abs(t.amount - avg) > Math.max(1, avg * 0.1))) continue;
    const last = [...list].sort((x, y) => y.date.localeCompare(x.date))[0];
    subs.push({ name, amount: last.amount, c: cat(last.categoryId) });
  }
  for (const r of state.recurring) if (r.template.type === 'depense') {
    const n = merchantName(r.template.note) || cat(r.template.categoryId)?.name;
    if (n && !subs.some(x => x.name.toUpperCase() === n.toUpperCase())) subs.push({ name: n, amount: r.template.amount, c: cat(r.template.categoryId) });
  }
  return subs.sort((x, y) => y.amount - x.amount);
}
const pct = (a, b) => b ? Math.round((a - b) / b * 100) : null;

    onOk(sh) {
      const amount = round2(Math.abs(parseAmount($('#txAmount', sh).value) || 0));
      if (!(amount > 0)) { toast('Saisissez un montant'); return false; }
      const accountId = $('#txAcc', sh).value, toAccountId = $('#txTo', sh).value, date = $('#txDate', sh).value || today();
      if (type === 'virement' && accountId === toAccountId) { toast('Choisissez deux comptes différents'); return false; }
      if (type !== 'virement' && !accountId) { toast('Choisissez un compte'); return false; }
      if (type !== 'virement' && !catId) { toast('Choisissez une catégorie'); return false; }
      const data = { type, date, amount, accountId: accountId || null, note: $('#txNote', sh).value.trim(), categoryId: type === 'virement' ? null : catId, toAccountId: type === 'virement' ? toAccountId || null : null };
      if (t) { Object.assign(t, data); toast('Opération modifiée'); }
      else if ($('#txRec', sh)?.checked) {
        const r = { id: uid(), template: data, startDate: date, day: Number(date.slice(8)), lastMonth: monthKey(date) };
        state.recurring.push(r);
        state.transactions.push({ ...data, id: uid(), created: Date.now(), recurringId: r.id });
        toast('Ajoutée, elle se répétera chaque mois');
      } else { state.transactions.push({ ...data, id: uid(), created: Date.now() }); toast('Opération ajoutée'); }
      save(); applyRecurring(); render();
    }
  });
}
async function deleteTx(id) {
  const t = state.transactions.find(x => x.id === id); if (!t) return;
  if (t.recurringId && state.recurring.some(r => r.id === t.recurringId)) {
    const stop = await ask('Cette opération se répète chaque mois.', 'Supprimer et arrêter la répétition', 'Supprimer seulement celle-ci');
    if (stop) state.recurring = state.recurring.filter(r => r.id !== t.recurringId);
  } else if (!await ask('Supprimer cette opération ?', 'Supprimer')) return;
  state.transactions = state.transactions.filter(x => x.id !== id);
  closeSheet(); save(); render(); toast('Opération supprimée');
}

function renderBudget() {
  const b = budgetSummary(month), mp = monthProgress(month), isNow = month === monthKey(today());
  const { income } = monthTotals(month);
  const expenseCats = catsOf('depense');
  const withBudget = expenseCats.filter(c => b.ids.includes(c.id))
    .map(c => ({ c, budget: state.budgets[c.id], spent: b.spent[c.id] || 0 }))
    .map(x => ({ ...x, st: budgetStatus(x.spent, x.budget, mp), ratio: x.spent / x.budget }))
    .sort((x, y) => ({ over: 0, fast: 1, ok: 2, full: 3 }[x.st] - { over: 0, fast: 1, ok: 2, full: 3 }[y.st]) || y.ratio - x.ratio);
  const without = expenseCats.filter(c => !b.ids.includes(c.id))
    .map(c => ({ c, spent: b.spent[c.id] || 0, avg: avgSpent(c.id, month) }))
    .sort((x, y) => y.spent - x.spent || y.avg - x.avg);
  const canSuggest = hasHistory(month) && without.some(x => x.avg > 0);
  let hero;
  if (!b.total) {
    hero = `<div class="card"><h2>Vos budgets</h2><p style="margin:0 0 14px">Fixez un plafond mensuel par catégorie pour savoir à tout moment combien il vous reste à dépenser.</p>

  } else {
    const st = budgetStatus(b.used, b.total, mp), daysLeft = isNow ? daysIn(month) - Number(today().slice(8)) + 1 : 0;
    const perDay = daysLeft ? Math.max(0, b.left) / daysLeft : 0;
    const centerLabel = month < monthKey(today()) ? (b.left >= 0 ? 'Économisé' : 'Dépassé') : 'Reste';
    hero = `<div class="card">
      <div class="ring-wrap">
        <div class="ring">${ring(b.used / b.total, STATUS_COLOR[st])}<div class="ring-center"><span class="label">${centerLabel}</span><span class="mid ${b.left < 0 ? 'neg' : ''}" style="font-size:20px">${fmt0(Math.abs(b.left))}</span></div></div>
        <div class="grow">
          <span class="chip-status ${st}">${STATUS_LABEL[st]}</span>
          <div class="kv" style="margin-top:8px"><span class="muted">Budget</span><b>${fmt(b.total)}</b></div>
          <div class="kv"><span class="muted">Dépensé</span><b>${fmt(b.used)}</b></div>
          ${isNow ? `<div class="kv"><span class="muted">Par jour</span><b>${fmt(perDay)}</b></div>` : ''}
        </div>
      </div>
      ${isNow ? `<div class="label" style="margin-top:12px">${daysLeft} jour(s) restant(s) dans le mois. Vous pouvez dépenser environ <b>${fmt(perDay)}</b> par jour en restant dans vos budgets.</div>` : ''}
      ${b.outside > 0 ? `<div class="label" style="margin-top:8px">Dépenses hors budget ce mois : <b>${fmt(b.outside)}</b></div>` : ''}
      ${income > 0 ? `<div class="label" style="margin-top:8px">Vos budgets représentent <b>${Math.round(b.total / income * 100)} %</b> de vos revenus du mois.</div>` : ''}
    </div>`;
  }
  const budgetRows = withBudget.map(x => `<button class="budget-item" data-action="editBudget" data-id="${x.c.id}">
      <div class="row">${avatar(x.c)}<span class="grow item-title">${esc(x.c.name)}</span><span class="chip-status ${x.st}">${STATUS_LABEL[x.st]}</span></div>
      ${progressBar(x.ratio, STATUS_COLOR[x.st], mp)}
      <div class="budget-foot"><span class="num">${fmt(x.spent)} sur ${fmt0(x.budget)}</span><span class="num ${x.spent > x.budget ? 'neg' : ''}">${x.spent > x.budget ? `+${fmt(x.spent - x.budget)}` : `reste ${fmt(x.budget - x.spent)}`}</span></div>
    </button>`).join('');
  const withoutRows = without.map(x => `<button class="item" data-action="editBudget" data-id="${x.c.id}">${avatar(x.c)}<span class="item-main"><span class="item-title">${esc(x.c.name)}</span><span class="item-sub">${x.avg > 0 ? `Moyenne ${fmt0(x.avg)} / mois` : 'Pas de dépense récente'}</span></span><span class="item-amt">${x.spent ? fmt(x.spent) : ''}</span><span class="chev">›</span></button>`).join('');
  $('#view-budget').innerHTML = `${monthBar()}${hero}

async function suggestBudgets() {

async function download(name, content, type) {

  if (dl) {
    try { await dl.save({ filename: name, data: new Blob([content], { type }) }); return true; }
    catch (e) { if (e?.code !== 'declined') toast('Téléchargement impossible ici'); return false; }
  }
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  return true;
}

function parseCsv(text) {
  const firstLine = text.split(/\r?\n/)[0] || '';

  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}

}

}

function autoCategory(note, type) {

  const r = state.rules.find(r => up.includes(r.keyword.toUpperCase()) && cat(r.categoryId)?.type === type);
  if (r) return r.categoryId;

function readCsvStatement(text) {

    if (r.length < 3) { skipped++; continue; }
    const date = parseDate(r[0]), amount = parseAmount(r[r.length - 1]), note = r.slice(1, -1).join(' ').replace(/\s+/g, ' ').trim();
    if (!date || amount === null || amount === 0) { skipped++; continue; }

function loadScript(src) {

async function pdfLib() {

async function readPdfStatement(buf) {
  const lib = await pdfLib();
  const doc = await lib.getDocument({ data: buf, isEvalSupported: false }).promise;
  const AMOUNT = /^-?\d{1,3}(?:[ .  ]\d{3})*,\d{2}$/, DATE = /^\d{2}\/\d{2}\/\d{4}$/;
  const rows = []; let allText = '', skipped = 0, holder = '';
  for (let n = 1; n <= doc.numPages; n++) {
    const page = await doc.getPage(n);
    const items = (await page.getTextContent()).items.filter(i => i.str.trim()).map(i => ({ s: i.str.trim(), x: i.transform[4], r: i.transform[4] + i.width, y: Math.round(i.transform[5]) }));
    allText += items.map(i => i.s).join(' ') + '\n';
    if (!holder) holder = items.map(i => cleanHolder(i.s)).find(Boolean) || '';
    const debit = items.find(i => /^D[ée]bit$/i.test(i.s)), credit = items.find(i => /^Cr[ée]dit$/i.test(i.s));
    if (!debit || !credit) continue;
    const headY = Math.max(debit.y, credit.y);
    const footY = Math.max(-1, ...items.filter(i => /^(A réception|Nouveau solde)/i.test(i.s)).map(i => i.y));
    // Regroupe les morceaux de texte par ligne (même hauteur à 2 points près).
    const lines = [];
    for (const it of items.filter(i => i.y < headY && i.y > footY).sort((a, b) => b.y - a.y || a.x - b.x)) {
      const l = lines.find(l => Math.abs(l.y - it.y) <= 2);
      if (l) l.items.push(it); else lines.push({ y: it.y, items: [it] });
    }
    lines.sort((a, b) => b.y - a.y).forEach(l => l.items.sort((a, b) => a.x - b.x));
    let last = null;
    for (const l of lines) {
      const first = l.items[0];
      const amounts = l.items.filter(i => AMOUNT.test(i.s) && i.x > debit.x - 120);
      if (DATE.test(first.s) && amounts.length) {
        const amt = amounts.at(-1), value = parseAmount(amt.s);
        const isCredit = Math.abs(amt.r - credit.r) < Math.abs(amt.r - debit.r);
        const labelParts = l.items.filter(i => i !== first && !amounts.includes(i) && !(DATE.test(i.s) && i.x > debit.x - 200));
        let note = labelParts.map(i => i.s).join(' ').replace(/\s+/g, ' ').trim(), date = parseDate(first.s);
        const card = note.match(/^CARTE (\d{2})\/(\d{2})\/(\d{2}) (.*)$/);
        if (card) { date = `20${card[3]}-${card[2]}-${card[1]}`; note = card[4]; }
        note = note.replace(/\s*CB\*\d{4}\s*$/, '').replace(/\s+\d$/, '').trim();
        if (!value) { skipped++; last = null; continue; }
        last = { date, amount: round2(Math.abs(value)), type: isCredit ? 'revenu' : 'depense', note };
        rows.push(last);
      } else if (last && !DATE.test(first.s) && /^(VIR|PRLV|REJ)/.test(last.note) && !/^R[èé]f/i.test(first.s) && !last.extra) {
        last.extra = true; last.note += ' · ' + l.items.map(i => i.s).join(' ').replace(/\s+/g, ' ').trim();
      }
    }
  }
  rows.forEach(r => delete r.extra);
  return { rows, skipped, text: allText, holder };
}

function applyFinary(list, at = new Date().toISOString()) {
  if (!list.length) return null;
  // Au premier import, on retire le compte par défaut s'il est vide.
  if (!state.accounts.some(a => a.finaryId) && state.accounts.length === 1) {
    const a0 = state.accounts[0];
    if (!a0.initial && !state.transactions.some(t => t.accountId === a0.id || t.toAccountId === a0.id)) state.accounts = [];
  }
  let added = 0, updated = 0, skipped = 0;
  for (const f of list) {
    if (!isFinite(f.balance)) { skipped++; continue; }
    let a = state.accounts.find(x => x.finaryId === f.id);
    if (!a) { a = { id: uid(), name: f.name, initial: 0, finaryId: f.id }; state.accounts.push(a); added++; } else updated++;
    a.finaryType = f.type;
    a.initial = 0;
    a.initial = round2(f.balance - accountBalance(a));
  }
  if (!state.accounts.length) state.accounts.push({ id: uid(), name: 'Compte courant', initial: 0 });
  if (!state.ownerName) state.ownerName = guessOwnerName();
  state.finarySyncedAt = at;
  save(); render();
  return `Finary : ${added} compte(s) ajouté(s), ${updated} mis à jour${skipped ? `, ${skipped} sans solde` : ''}`;
}
const finaryError = e => e?.code === 'server_not_connected' ? 'Finary n\'est pas connecté à votre compte Claude' : e?.code === 'denied' || e?.code === 'not_granted' ? 'Accès à Finary refusé' : 'Finary ne répond pas, réessayez plus tard';
async function syncFinary(silent = false) {
  if (finaryBusy) return;
  const mcp = await finaryAvailable();
  if (!mcp) { if (!silent) finaryPasteSheet(); return; }
  finaryBusy = true; if (!silent) toast('Connexion à Finary…');
  try {
    const msg = applyFinary(await fetchFinary(mcp));
    if (!silent) toast(msg || 'Aucun compte trouvé dans Finary');
  } catch (e) { if (!silent) toast(finaryError(e)); }
  finally { finaryBusy = false; }
}
const encodeCode = obj => 'MF1:' + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
function decodeCode(text) {
  const m = String(text).match(/MF1:([A-Za-z0-9+/=]+)/);
  if (!m) return null;
  try { const o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); return Array.isArray(o.accounts) ? o : null; } catch { return null; }
}
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast('Code copié'); return true; }
  catch { el?.focus(); el?.select(); toast('Sélectionnez le code puis copiez-le'); return false; }
}
// Version Claude : récupère les soldes et affiche le code à coller sur le site GitHub.
async function finaryCodeSheet() {
  const mcp = await finaryAvailable();
  if (!mcp) return finaryPasteSheet();
  toast('Connexion à Finary…');
  let list;
  try { list = await fetchFinary(mcp); } catch (e) { return toast(finaryError(e)); }
  applyFinary(list);
  const code = encodeCode({ at: new Date().toISOString(), accounts: list });
  $('#toast').classList.remove('show');
  openSheet('Soldes pour le site', `
    <div class="card"><b>${list.length} compte(s) Finary</b><div class="label">Soldes du ${new Date().toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</div></div>
    <button class="btn primary block" id="fcCopy">Copier le code</button>
    <textarea id="fcCode" readonly rows="4" style="width:100%;border:0;border-radius:14px;background:var(--surface);color:var(--muted);padding:12px;font:13px/1.4 ui-monospace,monospace;word-break:break-all">${code}</textarea>
    <p class="hint">Ouvrez ensuite le site GitHub : Réglages → Importer mes comptes Finary → Coller le code.</p>`, {
    onMount(sh) { $('#fcCopy', sh).onclick = () => copyText(code, $('#fcCode', sh)); }
  });
}
// Site GitHub : colle le code copié depuis la version Claude.
function finaryPasteSheet() {
  openSheet('Comptes Finary', `
    <p class="hint" style="margin:0">Finary n'est accessible que depuis la version Claude de l'application. Pour mettre à jour vos soldes ici :</p>
    <div class="list">
      <a class="item" href="${CLAUDE_APP_URL}" target="_blank" rel="noopener" style="text-decoration:none"><span class="avatar" style="--c:var(--accent)">1</span><span class="item-main"><span class="item-title">Ouvrir la version Claude</span><span class="item-sub">Réglages → Copier mes soldes Finary</span></span><span class="chev">›</span></a>
      <div class="item" style="cursor:default"><span class="avatar" style="--c:var(--accent)">2</span><span class="item-main"><span class="item-title">Revenir ici et coller le code</span><span class="item-sub">Le code commence par MF1:</span></span></div>
    </div>
    <button class="btn primary block" id="fpPaste">Coller le code</button>
    <textarea id="fpCode" rows="3" placeholder="…ou collez le code ici" style="width:100%;border:0;border-radius:14px;background:var(--surface);padding:12px;font:15px/1.4 var(--font)"></textarea>`, {
    okLabel: 'Importer',
    onMount(sh) {
      $('#fpPaste', sh).onclick = async () => {
        try { $('#fpCode', sh).value = await navigator.clipboard.readText(); $('#sheetOk').click(); }
        catch { $('#fpCode', sh).focus(); toast('Touchez le champ puis « Coller »'); }
      };
    },
    onOk(sh) {
      const data = decodeCode($('#fpCode', sh).value);
      if (!data) { toast('Code invalide : recopiez-le depuis la version Claude'); return false; }
      toast(applyFinary(data.accounts, data.at) || 'Aucun compte dans ce code');
    }
  });
}

// ---- Actions (un seul gestionnaire de clics pour toute l'application) ----
const actions = {
  tab: id => show(id),
  prevMonth: () => { month = shiftMonth(month, -1); render(); },
  nextMonth: () => { month = shiftMonth(month, 1); render(); },
  closeSheet,
  addTx: () => txSheet(),
  editTx: id => txSheet(id),
  opsType: id => { opsFilter.type = id; renderOps(); },
  opsScope: id => { opsFilter.all = id === 'all'; renderOps(); },
  review: () => reviewSheet(),
  report: () => reportSheet(),
  backup: () => backup(),
  ownerName: () => ownerSheet(),
  pinSet: () => showLock(state.pin ? 'check-change' : 'new'),
  pinOff: () => showLock('check-off'),
  editBudget: id => budgetSheet(id),
  budgetPick: () => $('#budgetFree')?.scrollIntoView({ behavior: 'smooth' }),
  suggestBudgets,
  addGoal: () => goalSheet(),
  editGoal: id => goalSheet(id),
  addAccount: () => accountSheet(),
  editAccount: id => accountSheet(id),
  addCategory: () => categorySheet(),
  editCategory: id => categorySheet(id),
  addRule: () => ruleSheet(),
  editRule: id => ruleSheet(id),
  finary: () => syncFinary(),
  finaryCode: () => finaryCodeSheet(),
  importCsv: () => $('#fileCsv').click(),
  importJson: () => $('#fileJson').click(),
  exportCsv,
  demo: async () => {
    if (state.transactions.length && !await ask('Remplacer vos données par des exemples ?', 'Remplacer')) return;
    const pin = state.pin; state = demoState(); if (pin) state.pin = pin; save(); applyTheme(); month = monthKey(today()); show('home'); toast('Exemples chargés');
  },
  clearTx: async () => {
    if (!state.transactions.length && !state.recurring.length) return toast('Aucune opération à supprimer');
    if (!await ask(`Supprimer définitivement les ${state.transactions.length} opération(s) ? Comptes, catégories, budgets et objectifs sont conservés.`, 'Tout supprimer')) return;
    state.transactions = []; state.recurring = []; save(); render(); toast('Toutes les opérations ont été supprimées');
  },
  resetAll: async () => {
    if (!await ask('Effacer définitivement toutes vos données ? Pensez à exporter une sauvegarde avant.', 'Tout effacer')) return;
    state = freshState(); save(); applyTheme(); render(); toast('Données effacées');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  actions[el.dataset.action]?.(el.dataset.id, el);
});

// ---- Code à 4 chiffres ----
// Modes : unlock (ouverture), new / confirm (création), check-change / check-off (code actuel demandé d'abord).
let lockMode = null, lockInput = '', lockFirst = '', hiddenAt = 0, unlocked = false;
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  if (crypto?.subtle) return [...new Uint8Array(await crypto.subtle.digest('SHA-256', data))].map(b => b.toString(16).padStart(2, '0')).join('');
  let h = 2166136261; for (const b of data) { h ^= b; h = Math.imul(h, 16777619); } return 'f' + (h >>> 0).toString(16);
}
const LOCK_TITLES = { unlock: 'Saisissez votre code', new: 'Choisissez un code à 4 chiffres', confirm: 'Confirmez le code', 'check-change': 'Saisissez votre code actuel', 'check-off': 'Saisissez votre code actuel' };
function showLock(mode = 'unlock') {
  if (mode === 'unlock' && !state.pin) return;
  lockMode = mode; lockInput = ''; lockFirst = mode === 'confirm' ? lockFirst : '';
  const el = $('#lock');
  el.innerHTML = `<h2>${LOCK_TITLES[mode]}</h2><div class="dots" id="lockDots">${'<i></i>'.repeat(4)}</div><div class="lock-msg" id="lockMsg"></div>
    <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button data-k="${d}">${d}</button>`).join('')}${mode === 'unlock' ? '<button class="ghost" data-k="forgot">Oublié ?</button>' : '<button class="ghost" data-k="cancel">Annuler</button>'}<button data-k="0">0</button><button class="ghost" data-k="del" aria-label="Effacer">⌫</button></div>`;
  el.classList.remove('hidden'); document.body.classList.add('locked');
}
function hideLock() { lockMode = null; $('#lock').classList.add('hidden'); if ($('#sheetBg').classList.contains('hidden')) document.body.classList.remove('locked'); }
function lockError(msg) {
  lockInput = ''; $$('#lockDots i').forEach(i => i.classList.remove('on'));
  const d = $('#lockDots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  $('#lockMsg').textContent = msg; $('#lockMsg').classList.add('err');
}
$('#lock').addEventListener('click', async e => {
  const k = e.target.closest('[data-k]')?.dataset.k; if (!k) return;
  if (k === 'cancel') return hideLock();
  if (k === 'forgot') {
    if (await ask('Le code ne peut pas être récupéré. Vous pouvez effacer les données de l\'application puis restaurer une sauvegarde.', 'Effacer et recommencer')) { state = freshState(); save(); applyTheme(); hideLock(); show('home'); toast('Données effacées'); }
    return;
  }
  if (k === 'del') lockInput = lockInput.slice(0, -1); else if (lockInput.length < 4) lockInput += k;
  $$('#lockDots i').forEach((i, n) => i.classList.toggle('on', n < lockInput.length));
  if (lockInput.length < 4) return;
  const code = lockInput;
  if (lockMode === 'new') { lockFirst = code; return showLock('confirm'); }
  if (lockMode === 'confirm') {
    if (code !== lockFirst) return lockError('Les codes ne correspondent pas');
    const salt = uid(); state.pin = { salt, hash: await hashPin(code, salt) }; unlocked = true; save(); hideLock(); render(); return toast('Code activé');
  }
  if (!state.pin || await hashPin(code, state.pin.salt) !== state.pin.hash) return lockError('Code incorrect');
  unlocked = true;
  if (lockMode === 'check-change') return showLock('new');
  if (lockMode === 'check-off') { delete state.pin; save(); hideLock(); render(); return toast('Code désactivé'); }
  hideLock();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (state.pin && !lockMode && hiddenAt && Date.now() - hiddenAt > 60000) showLock();
});

// ---- Changer de mois en glissant le doigt ----
let touch = null;
$('main').addEventListener('touchstart', e => {
  const t = e.touches[0];
  touch = e.touches.length === 1 && t.clientX > 24 && t.clientX < innerWidth - 24 && !e.target.closest('input, select, textarea, svg') ? { x: t.clientX, y: t.clientY, at: Date.now() } : null;
}, { passive: true });
$('main').addEventListener('touchend', e => {
  if (!touch || !['home', 'ops', 'budget'].includes(view) || (view === 'ops' && opsFilter.all)) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y, quick = Date.now() - touch.at < 700;
  touch = null;
  if (!quick || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
  month = shiftMonth(month, dx < 0 ? 1 : -1); render();
  const sec = $('#view-' + view); sec.classList.remove('slide-next', 'slide-prev'); void sec.offsetWidth; sec.classList.add(dx < 0 ? 'slide-next' : 'slide-prev');
}, { passive: true });

// ---- Démarrage ----
load(); applyTheme(); applyRecurring(); show('home');
if (state.pin) showLock();
connectCloud().finally(() => {
  if (state.pin && !unlocked && !lockMode) showLock(); // code arrivé avec les données du compte Claude
  if (state.finarySyncedAt) syncFinary(true);
});
})();
</script>
