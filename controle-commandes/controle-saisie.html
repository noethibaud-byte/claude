<title>Contrôle saisie ARCHIMEDE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout : liste des commandes en haut, puis la feuille de contrôle façon impression A4 */
:root{
  --bg:#e9ebe8; --paper:#ffffff; --fg:#111111; --muted:#555c58; --rule:#111111; --cell:#8a8f8c; --head:#e8e8e8;
  --accent:#2f6b4f; --accent-fg:#ffffff;
  --red:#b3261e; --red-bg:#fde3e0;
  --amber:#a06a00; --amber-line:#c48a00; --amber-bg:#fff2d6;
  --green:#2b7247; --green-bg:#e3f2e8;
  --done:#9aa19d;
  --sans:"DejaVu Sans",Arial,"Helvetica Neue",sans-serif;
  --mono:"DejaVu Sans Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121513; --paper:#1c201e; --fg:#ecefed; --muted:#a3aba7; --rule:#d8ddda; --cell:#4a524e; --head:#262b28;
  --accent:#7cc3a0; --accent-fg:#0f1a14; --red:#ff8a80; --red-bg:#3d211e; --amber:#f2c063; --amber-line:#c99a3a; --amber-bg:#352a14;
  --green:#7fd19b; --green-bg:#1b3124; --done:#5d6661; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121513; --paper:#1c201e; --fg:#ecefed; --muted:#a3aba7; --rule:#d8ddda; --cell:#4a524e; --head:#262b28;
  --accent:#7cc3a0; --accent-fg:#0f1a14; --red:#ff8a80; --red-bg:#3d211e; --amber:#f2c063; --amber-line:#c99a3a; --amber-bg:#352a14;
  --green:#7fd19b; --green-bg:#1b3124; --done:#5d6661; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.4}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.list-head h1{font-size:1.3rem}
.list-head span{color:var(--muted);font-size:.85rem}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.order{background:var(--paper);border:1.5px solid var(--cell);border-radius:6px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.order[aria-current="true"]{border-color:var(--rule);box-shadow:inset 0 0 0 1.5px var(--rule)}
.order b{font-size:1.05rem}
.order small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order.new{border-style:dashed;align-items:center;justify-content:center;color:var(--accent);font-weight:700;background:transparent;min-height:84px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:3px;border:1.2px solid}
.c-red{color:var(--red);border-color:var(--red)} .c-amber{color:var(--amber);border-color:var(--amber-line)} .c-green{color:var(--green);border-color:var(--green)}
.c-muted{color:var(--muted);border-color:var(--cell)}

.sheet{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.18);padding:26px 28px 30px;display:flex;flex-direction:column;gap:6px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--rule);padding-bottom:6px}
.top h2{font-size:1.45rem}
.meta{font-size:.82rem;color:var(--muted)}
.score{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.score span{border:1.5px solid;padding:3px 10px;border-radius:4px;font-weight:700;font-size:.85rem}
.sheet h3.sec{font-size:1rem;margin:12px 0 4px;border-bottom:1.5px solid var(--rule);padding-bottom:2px}
.issue{border:1px solid var(--cell);border-left:7px solid;border-radius:4px;padding:7px 11px;display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.issue.erreur{border-left-color:var(--red)} .issue.verifier{border-left-color:var(--amber-line)}
.issue.regle{border-left-color:var(--done)}
.issue.regle .ititle{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.ititle{font-weight:700;font-size:.95rem}
.lbl{font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:3px;margin-right:6px;color:#fff;display:inline-block}
.lbl.erreur{background:#b3261e} .lbl.verifier{background:#a06a00} .lbl.regle{background:#5f6763}
.todo{font-weight:700}
.todo::before{content:"→ "}
.cmp{display:flex;gap:6px;flex-wrap:wrap}
.cmp div{border:1px solid var(--cell);padding:3px 9px;border-radius:3px}
.cmp small{display:block;font-size:.68rem;text-transform:uppercase;color:var(--muted)}
.cmp strong{font-family:var(--mono)}
.cmp .bad strong{color:var(--red)}
.choices{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.choices label,.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:15px;height:15px;margin:0;flex:none}
.note{width:100%;border:0;border-bottom:1px dotted var(--cell);background:transparent;padding:2px 0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{border:1px solid var(--cell);padding:3px 6px;text-align:left;vertical-align:top}
th{background:var(--head);font-size:.68rem;text-transform:uppercase}
td.n{font-family:var(--mono);white-space:nowrap}
tr.erreur td{background:var(--red-bg);font-weight:700}
tr.verifier td:last-child{color:var(--amber);font-weight:700}
tr.corrige td{font-weight:700}
td.ck{text-align:center}
.ok{columns:2 220px;margin:0;padding-left:18px;font-size:.85rem}
.nc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.nc li{display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.nc li.done .t{text-decoration:line-through;color:var(--muted)}
.nc-none{color:var(--green);font-weight:700}
.entete{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 16px}
.foot{font-size:.75rem;color:var(--muted)}
.sign{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.sign label{flex:1 1 180px;border-top:1px solid var(--rule);padding-top:3px;font-size:.8rem;display:flex;flex-direction:column;gap:2px}
.sign input{border:0;border-bottom:1px dotted var(--cell);background:transparent;padding:2px 0}
.state{background:var(--paper);border:1px dashed var(--cell);border-radius:6px;padding:20px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.state b{color:var(--fg)}
.saved{font-size:.75rem;color:var(--muted);min-height:1em}

/* Boîtes d'action : joindre la fiche de fab, nouvelle commande */
.action{border:2px solid var(--accent);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.action h3{font-size:1rem}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:5px;padding:9px 14px;font-weight:700;cursor:pointer;align-self:flex-start}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--cell)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:.85rem;color:var(--muted)}
.status.err{color:var(--red);font-weight:700}
.files{font-size:.8rem;color:var(--muted)}
.files a{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:3px;font-size:.85rem}
.field input[type=text]{border:1.5px solid var(--cell);border-radius:4px;padding:7px 9px;background:var(--paper)}
.picked{font-size:.8rem;color:var(--muted)}
.del{margin-top:22px;padding-top:12px;border-top:1px dashed var(--cell);display:flex;flex-direction:column;gap:8px}
.del.confirm{border:2px solid var(--red);border-radius:6px;padding:12px 14px;background:var(--red-bg)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger-fill{background:var(--red);color:#fff}
@media (max-width:520px){.sheet{padding:16px 14px 20px}}

/* Copie hors écran qui sert à fabriquer le PDF : toujours en clair, largeur A4 */
.pdf{--bg:#ffffff;--paper:#ffffff;--fg:#111111;--muted:#444a46;--rule:#111111;--cell:#8a8f8c;--head:#e8e8e8;
  --red:#b3261e;--red-bg:#fde3e0;--amber:#8a5a00;--amber-line:#c48a00;--green:#2b7247;--done:#9aa19d;
  position:fixed;left:-12000px;top:0;width:794px;background:#fff;color:#111;font-size:13px}
.pdf .sheet{box-shadow:none;padding:28px 34px}
.pdf .ok{columns:auto}
.pdf .tbl{overflow:visible}
.pdf table{font-size:10px;width:100%}
.pdf th{font-size:8.5px}
.pdf th,.pdf td{padding:2px 4px}
.pdf td.n{white-space:normal;font-size:9px}
.pdf td.part{min-width:190px}
td.part{min-width:160px}
.pdf .box{display:inline-block;width:11px;height:11px;border:1.2px solid #111;margin-right:5px;vertical-align:-1px;text-align:center;line-height:10px;font-size:10px;font-weight:700}
.pdf .val{display:inline-block;min-width:140px;border-bottom:1px dotted #8a8f8c;padding:1px 0}
.printbtn{background:transparent;border:1.5px solid var(--rule);border-radius:5px;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--fg)}
</style>

<div class="wrap">
  <div class="list-head"><h1>Contrôle saisie ARCHIMEDE</h1><span id="count"></span></div>
  <div class="orders" id="orders" role="list"></div>
  <div id="main">
    <div class="state"><b>Chargement des commandes…</b></div>
  </div>
  <p class="saved" id="saved" aria-live="polite"></p>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  function h(tag, attrs, ...kids){
    const el = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs||{})){
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'checked') el.checked = !!v;
      else if (k === 'value') el.value = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)){
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const S = v => (v == null ? '' : String(v));

  let db = null, sample = null, assets = null, downloads = null;
  let orders = [], etats = {}, current = null;
  let busy = null; // {id, ctl, status, err}
  let confirmDel = null; // id de la commande dont on demande la suppression
  const NIV = {erreur:'ERREUR', verifier:'À VÉRIFIER', regle:'RÉGLÉ'};

  // Partie « contrôle » d'une commande : résultat de la vérification, ou la commande elle-même (ancien format)
  const ctrl = o => o.verif || (o.type === 'controle' ? o : null);

  function etat(id){ return etats[id] || {issues:{}, checks:{}, signatures:{}}; }
  function issueDone(o, is){ const e = etat(o.id).issues?.[is.id]; return !!(e && e.choix); }
  function counts(o){
    const c = ctrl(o); const iss = (c && c.issues) || [];
    return {
      err: iss.filter(i => i.niveau === 'erreur' && !issueDone(o,i)).length,
      ver: iss.filter(i => i.niveau === 'verifier' && !issueDone(o,i)).length,
      ok: (c && c.posOk) || 0
    };
  }
  function edited(o){ const s = etat(o.id).signatures || {}; return !!(s.edition && s.edition.trim()); }

  // ---- écriture des états (une à la fois par document) ----
  const queues = {};
  function save(id, patch){
    const cur = JSON.parse(JSON.stringify(etat(id)));
    deepMerge(cur, patch);
    etats[id] = cur;
    renderList();
    if (!db) return;
    queues[id] = (queues[id] || Promise.resolve()).then(() => db.doc('etats/' + id).set(cur))
      .then(() => { $('#saved').textContent = 'Enregistré.'; })
      .catch(e => { $('#saved').textContent = e && e.code === 'invalid_argument'
        ? "Vous n'avez pas le droit de modifier cette page : demandez un accès Contributeur."
        : "Enregistrement impossible pour le moment. Réessayez dans un instant."; });
  }
  function deepMerge(t, p){
    for (const [k,v] of Object.entries(p)){
      if (v && typeof v === 'object' && !Array.isArray(v)){ t[k] = t[k] && typeof t[k] === 'object' ? t[k] : {}; deepMerge(t[k], v); }
      else t[k] = v;
    }
  }

  // ---- liste ----
  function renderList(){
    const box = $('#orders'); box.replaceChildren();
    $('#count').textContent = orders.length ? orders.length + (orders.length > 1 ? ' commandes' : ' commande') : '';
    for (const o of orders){
      const c = counts(o);
      const chips = [];
      if (!ctrl(o)) chips.push(h('span',{class:'chip c-muted'}, 'Fiche de fab à joindre'));
      else {
        if (c.err) chips.push(h('span',{class:'chip c-red'}, c.err + ' erreur' + (c.err>1?'s':'')));
        if (c.ver) chips.push(h('span',{class:'chip c-amber'}, c.ver + ' à vérifier'));
        if (!c.err && !c.ver) chips.push(h('span',{class:'chip c-green'},'Tout réglé'));
      }
      if (edited(o)) chips.push(h('span',{class:'chip c-green'},'Éditée'));
      if (busy && busy.id === o.id) chips.push(h('span',{class:'chip c-muted'},'Vérification…'));
      box.append(h('button',{class:'order', role:'listitem', 'aria-current': current === o.id ? 'true' : 'false',
        onclick:() => { location.hash = 'c-' + o.id; }},
        h('b',null, o.titreCourt || ('Commande ' + o.num)),
        h('small',null, [o.client, o.chantier].filter(Boolean).join(' · ')),
        h('div',{class:'chips'}, chips)));
    }
    box.append(h('button',{class:'order new', role:'listitem', 'aria-current': current === 'nouvelle' ? 'true' : 'false',
      onclick:() => { location.hash = 'nouvelle'; }}, '+ Nouvelle commande'));
  }

  // ---- feuille ----
  function renderSheet(){
    const main = $('#main');
    if (current === 'nouvelle'){ main.replaceChildren(newOrderForm()); return; }
    const o = orders.find(x => x.id === current);
    if (!o){
      main.replaceChildren(h('div',{class:'state'},
        h('b',null, orders.length ? 'Choisissez une commande ci-dessus.' : 'Aucune commande pour le moment.'),
        h('p',null,"Cliquez sur « + Nouvelle commande » et prenez l'ARC en photo.")));
      return;
    }
    const e = etat(o.id);
    const c = ctrl(o);
    const sheet = h('article',{class:'sheet'});
    sheet.append(h('div',{class:'top'},
      h('div',null, h('h2',null, o.titre), h('div',{class:'meta'}, o.meta)),
      h('div',{class:'row', style:'flex-direction:column;align-items:flex-end;gap:6px'},
        downloads ? h('button',{class:'printbtn', type:'button', 'data-noprint':'', onclick: ev => exportPdf(o, ev.currentTarget)}, 'Imprimer (PDF)') : null,
        (c && c.date) ? h('div',{class:'meta'}, 'Contrôlé le ' + c.date) : null)));

    if (c){
      const k = counts(o);
      sheet.append(h('div',{class:'score'},
        h('span',{class:'c-red'}, k.err + ' ERREUR' + (k.err>1?'S':'')),
        h('span',{class:'c-amber'}, k.ver + ' À VÉRIFIER'),
        h('span',{class:'c-green'}, k.ok + ' POSITIONS OK')));
    }

    if (o.type !== 'controle') sheet.append(fabBox(o));

    if (c){
      // Résumé : uniquement ce qui n'est pas conforme, une ligne par point
      const iss = c.issues || [];
      sheet.append(h('h3',{class:'sec'},"Non conforme à l'ARC"));
      if (!iss.length) sheet.append(h('p',{class:'nc-none'},"Rien à signaler : tout est conforme à l'ARC."));
      else sheet.append(h('ul',{class:'nc'}, iss.map(is => {
        const st = e.issues?.[is.id] || {};
        const lvl = st.choix ? 'regle' : is.niveau;
        return h('li',{class: st.choix ? 'done' : null}, h('span',{class:'lbl ' + lvl}, NIV[lvl]), h('span',{class:'t'}, is.titre),
          st.choix ? h('span',{class:'foot'}, ' → ' + st.choix) : null);
      })));
      if (iss.length){
        sheet.append(h('h3',{class:'sec'},'Détail des points'));
        for (const is of iss) sheet.append(issueBox(o, e, is));
      }
      if (c.positions){
        sheet.append(h('h3',{class:'sec'},'Détail position par position'));
        sheet.append(table(c.positions));
        if (c.positions.foot) sheet.append(h('p',{class:'foot'}, c.positions.foot));
      }
    }

    if (o.type !== 'controle'){
      if (o.entete && o.entete.length){
        sheet.append(h('h3',{class:'sec'}, c ? "Fiche de saisie : en-tête de l'ARC" : 'En-tête'));
        sheet.append(h('div',{class:'entete'}, o.entete.map((t,i) => {
          const key = 'e' + i;
          return h('label',{class:'chk'}, h('input',{type:'checkbox', checked: e.checks?.[key],
            onchange: ev => save(o.id,{checks:{[key]:ev.target.checked}})}), h('span',null,t));
        })));
      }
      if (o.positions){
        sheet.append(h('h3',{class:'sec'}, c ? "Fiche de saisie : positions de l'ARC" : 'Positions'));
        sheet.append(table(o.positions, o));
        if (o.positions.foot) sheet.append(h('p',{class:'foot'}, o.positions.foot));
      }
    }

    const sig = o.signatures || ['Saisie corrigée le', 'Vérifiée par', 'Commande éditée le'];
    const keys = ['saisie','verif','edition'];
    sheet.append(h('div',{class:'sign'}, sig.map((lab,i) => h('label',null, lab,
      h('input',{type:'text', id:'sig-' + o.id + '-' + i, value: e.signatures?.[keys[i]] || '',
        onchange: ev => save(o.id,{signatures:{[keys[i]]:ev.target.value}})})))));
    sheet.append(deleteBox(o));
    main.replaceChildren(sheet);
  }

  function issueBox(o, e, is){
    const st = e.issues?.[is.id] || {};
    const done = !!st.choix;
    const lvl = done ? 'regle' : is.niveau;
    const box = h('div',{class:'issue ' + is.niveau + (done ? ' regle' : '')});
    box.append(h('div',{class:'ititle'}, h('span',{class:'lbl ' + lvl}, NIV[lvl]), is.titre));
    if (is.texte) box.append(h('p',null,is.texte));
    if (is.compare && is.compare.length) box.append(h('div',{class:'cmp'}, is.compare.map(x =>
      h('div',{class:x.bad ? 'bad' : null}, h('small',null,x.label), h('strong',null,x.val)))));
    if (is.action) box.append(h('p',{class:'todo'}, is.action));
    if (is.table) box.append(table(is.table));
    if (is.note) box.append(h('p',{class:'foot'}, is.note));
    const name = 'ch-' + o.id + '-' + is.id;
    const choix = (is.choix && is.choix.length) ? is.choix : (is.niveau === 'erreur' ? ['Corrigé','Validé tel quel'] : ['OK','Corrigé']);
    box.append(h('div',{class:'choices'},
      choix.map(lab => h('label',null,
        h('input',{type:'radio', name, checked: st.choix === lab,
          onchange: () => { save(o.id,{issues:{[is.id]:{choix:lab}}}); renderSheet(); }}), lab)),
      done ? h('button',{type:'button', class:'chip c-muted', style:'cursor:pointer;background:none',
        onclick: () => { save(o.id,{issues:{[is.id]:{choix:''}}}); renderSheet(); }}, 'Rouvrir') : null));
    box.append(h('input',{class:'note', type:'text', id:'note-' + o.id + '-' + is.id, placeholder:'Décision, commentaire…',
      value: st.note || '', 'aria-label':'Commentaire : ' + is.titre,
      onchange: ev => save(o.id,{issues:{[is.id]:{note:ev.target.value}}})}));
    return box;
  }

  function table(t, o){
    const checkCols = (o && t.checkCols) || [];
    const e = o ? etat(o.id) : null;
    return h('div',{class:'tbl'}, h('table',null,
      h('thead',null, h('tr',null, (t.head||[]).map(x => h('th',null,x)), checkCols.map(x => h('th',null,x)))),
      h('tbody',null, (t.rows||[]).map((r,ri) => {
        const cells = Array.isArray(r) ? r : (r.cells || []);
        const cls = Array.isArray(r) ? null : r.statut;
        // « FE02 - RDC » sous la position FE02 : on ne garde que « RDC »
        const shown = cells.map((x,ci) => {
          const s = S(x), p = S(cells[0]);
          return (ci === 1 && /^R[ÉE]F/i.test(S((t.head||[])[1])) && p && s.startsWith(p + ' - ')) ? s.slice(p.length + 3) : s;
        });
        return h('tr',{class:cls},
          shown.map((x,ci) => (t.mono||[]).includes(ci)
            ? h('td',{class:'n'}, x.replace(/ × /g, '\u00a0×\u00a0'))
            : h('td',{class:/^particularit/i.test(S((t.head||[])[ci])) ? 'part' : null}, x)),
          checkCols.map((col,ci) => {
            const key = 'p' + ri + '-' + ci;
            return h('td',{class:'ck'}, h('input',{type:'checkbox', 'aria-label': col + ' ligne ' + (ri+1),
              checked: e.checks?.[key], onchange: ev => save(o.id,{checks:{[key]:ev.target.checked}})}));
          }));
      }))));
  }

  // ---- fichiers → images pour Claude ----
  function loadScript(src){
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.append(s); });
  }
  async function pdfjs(){
    if (!window.pdfjsLib){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
    }
    return window.pdfjsLib;
  }
  async function filesToImages(files, progress){
    const out = [];
    for (const f of files){
      const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      if (!isPdf){ out.push(f); continue; }
      const lib = await pdfjs();
      const doc = await lib.getDocument({data: new Uint8Array(await f.arrayBuffer())}).promise;
      for (let i = 1; i <= doc.numPages; i++){
        progress('Lecture de « ' + f.name + ' » : page ' + i + ' sur ' + doc.numPages + '…');
        const page = await doc.getPage(i);
        const vp0 = page.getViewport({scale:1});
        const vp = page.getViewport({scale: Math.min(2.2, 1150 / Math.max(vp0.width, vp0.height) * 1.4)});
        const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height);
        await page.render({canvasContext: cx, viewport: vp}).promise;
        out.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.88)));
      }
    }
    return out;
  }
  async function keepFiles(files){
    if (!assets) return [];
    const kept = [];
    for (const f of files){
      try { const r = await assets.upload(f, f.type ? undefined : {type:'application/pdf'}); kept.push({id:r.id, nom:f.name}); }
      catch (_) { /* le fichier n'est pas conservé, la vérification continue */ }
    }
    return kept;
  }
  function sampleMsg(e){
    const c = e && e.code;
    if (c === 'cancelled') return 'Arrêté.';
    if (c === 'not_granted' || c === 'sampling_disabled') return "Claude n'est pas autorisé sur cette page. Autorisez-le dans le menu de la page, puis recommencez.";
    if (c === 'images_unavailable') return "Ce poste ne peut pas envoyer d'images à Claude depuis la page.";
    if (c === 'image_rejected') return 'Un fichier est illisible ou trop lourd. Essayez avec un autre fichier.';
    if (c === 'rate_limited') return 'Trop de demandes pour le moment. Réessayez dans quelques minutes.';
    if (c === 'invalid_json') return "La réponse de Claude n'a pas pu être lue. Relancez la vérification.";
    if (c === 'session_expired') return 'Reconnectez-vous à claude.ai, puis recommencez.';
    return "La lecture a échoué. Relancez dans un instant.";
  }
  async function imageBudget(){
    if (!sample) throw {code:'sampling_disabled'};
    const lim = await sample.limits().catch(() => null);
    if (!lim || !lim.images) throw {code:'images_unavailable'};
    return Math.max(1, Math.min(lim.images.maxCount || 5, 10));
  }

- Les fiches de fab sont numérotées dans l'ordre de saisie dans ARCHIMEDE (…_1 = première menuiserie saisie), pas dans l'ordre de l'ARC. Ne suppose jamais que la ligne N de l'ARC est la fiche N.
- Les positions de l'ARC et d'ARCHIMEDE peuvent être numérotées différemment : rapproche-les par la référence client (Me01…), le type et les cotes.

FICHES DE FABRICATION (extraites) :
${JSON.stringify(fab)}

Réponds uniquement avec un objet JSON de cette forme (textes en français, courts et concrets) :
{"issues":[{"niveau":"erreur","titre":"Repère 8, fenêtre escalier (fiche 1034_8) : hauteur et largeur inversées","texte":"Ce qui ne va pas, en une ou deux phrases.","compare":[{"label":"ARC demande","val":"H 670 × L 710"},{"label":"Fiche de fab","val":"H 710 × L 670","bad":true}],"action":"Ce qu'il faut faire dans ARCHIMEDE.","choix":["Corrigé","Validé tel quel"]}],
"positions":[{"pos":"8","ref":"Fenêtre escalier Me09","fiches":"1034_8","arc":"H 670 × L 710","fab":"H 710 × L 670","sensArc":"OF GT","sensFab":"OF GCH","statut":"ERREUR"}]}
"niveau" vaut "erreur" (écart certain) ou "verifier" (doute, information manquante). "statut" vaut "OK", "À vérifier" ou "ERREUR". Une ligne "positions" par position de l'ARC. Si tout est conforme, "issues" est un tableau vide.`;

  function cleanReport(r, run){
    const arr = x => Array.isArray(x) ? x : [];
    const issues = arr(r && r.issues).map((x,i) => ({
      id: run + '-' + i,
      niveau: x && x.niveau === 'erreur' ? 'erreur' : 'verifier',
      titre: S(x && x.titre) || 'Point à vérifier',
      texte: S(x && x.texte), action: S(x && x.action),
      compare: arr(x && x.compare).slice(0,4).map(c => ({label:S(c && c.label), val:S(c && c.val), bad:!!(c && c.bad)})),
      choix: arr(x && x.choix).map(S).filter(Boolean).slice(0,4)
    }));
    const st = {'OK':null, 'À vérifier':'verifier', 'ERREUR':'erreur'};
    const pos = arr(r && r.positions);
    const rows = pos.map(p => {
      const s = S(p && p.statut); const cls = s in st ? st[s] : 'verifier';
      const cells = [p.pos, p.ref, p.fiches, p.arc, p.fab, p.sensArc, p.sensFab, s || 'À vérifier'].map(S);
      return cls ? {cells, statut:cls} : cells;
    });
    return {
      issues, ok: arr(r && r.ok).map(S).filter(Boolean),
      posOk: pos.filter(p => S(p && p.statut) === 'OK').length,
      positions: {head:['Repère ARC','Désignation','Fiche(s) de fab','ARC H × L','Fab H × L','Sens ARC','Sens fab','Statut'], mono:[3,4], rows}
    };
  }

  async function runVerification(o, files){
    const ctl = new AbortController();
    busy = {id:o.id, ctl, status:'Préparation…', err:false};
    const say = (t, err) => { busy.status = t; busy.err = !!err; const el = document.getElementById('st-' + o.id); if (el){ el.textContent = t; el.className = 'status' + (err ? ' err' : ''); } };
    renderList(); renderSheet();
    try {
      const per = await imageBudget();
      const imgs = await filesToImages(files, say);
      if (ctl.signal.aborted) throw {code:'cancelled'};
      say('Enregistrement des fichiers…');
      const fichiers = await keepFiles(files);
      const fab = [];
      for (let i = 0; i < imgs.length; i += per){
        const chunk = imgs.slice(i, i + per);
        const a = i + 1, b = i + chunk.length;
        say('Claude lit les pages ' + a + ' à ' + b + ' sur ' + imgs.length + '…');
        const part = await sample.json(EXTRACT(a, b, chunk.length), {images: chunk, signal: ctl.signal});
        if (Array.isArray(part)) fab.push(...part.filter(x => x && typeof x === 'object'));
      }
      // Une position peut s'étaler sur deux paquets de pages : on fusionne par numéro
      const byPos = {};
      for (const p of fab){
        const m = S(p.pos).match(/(\d+)\s*$/);
        const k = m ? String(Number(m[1])) : ('?' + Object.keys(byPos).length);
        byPos[k] = Object.assign(byPos[k] || {}, p, {pos: m ? k : p.pos});
      }
      const merged = Object.values(byPos);
      say('Claude compare avec l\'ARC…');
      const rep = await sample.json(COMPARE(o, merged), {signal: ctl.signal, modelTier:'complex', cache:false});
      const run = 'v' + Date.now().toString(36);
      const d = new Date();
      const verif = Object.assign(cleanReport(rep, run), {
        date: d.toLocaleDateString('fr-FR'), fab: merged, fichiers, pages: imgs.length
      });
      const docBody = JSON.parse(JSON.stringify(Object.assign({}, o)));
      delete docBody.id; docBody.verif = verif;
      await db.doc('commandes/' + o.id).set(docBody);
      busy = null; $('#saved').textContent = 'Vérification enregistrée.';
    } catch (e){
      const msg = e && e.code ? sampleMsg(e) : (e && e.message === 'script' ? "Le lecteur de PDF n'a pas pu se charger. Prenez plutôt les pages en photo." : "La vérification a échoué : " + (e && e.message || 'erreur inconnue') + '.');
      busy = {id:o.id, status:msg, err:true, done:true};
    }
    renderList(); renderSheet();
  }

  function fabBox(o){
    const c = ctrl(o);
    const running = busy && busy.id === o.id && !busy.done;
    const input = h('input',{type:'file', id:'fab-' + o.id, accept:'application/pdf,image/*', multiple:true, hidden:true,
      onchange: ev => { const f = [...ev.target.files]; if (f.length) runVerification(o, f); }});
    const box = h('div',{class:'action'},

        h('button',{class:'btn', type:'button', disabled: running || !sample || !db, onclick:() => input.click()},

  // ---- nouvelle commande ----
  const ARC_PROMPT = n => `Les ${n} images jointes sont un ARC (accusé de réception de commande) de menuiseries bois de l'entreprise Menuiserie Savoyarde, parfois annoté à la main. Recopie son contenu pour préparer la saisie dans le logiciel ARCHIMEDE.
Réponds uniquement avec un objet JSON de cette forme :
{"arc":"5345 NG","client":"BFM","projet":"Merlin","chantier":"Col du Joly","gamme":"RT68 PIN SYLVESTRE",
"entete":["Type de pose : applique, cochonnet 30","Altitude : 2000 m","Section des dormants : 68 × 80","Traitement et finition : IFH, finition chantier sous 3 mois","Jeu : 12","Quincaillerie : F9, poignées ATLANTA aspect inox","Parcloses : intérieures"],
"positions":[{"pos":"1","ref":"Me01 - Séjour","type":"PF2","ofob":"OF","sens":"VP D","vmc":"","tableauH":2020,"tableauL":1230,"fabH":2070,"fabL":1330,"fabSource":"imprimé","qte":1,"particularites":"Seuil alu","details":"TB 135, verrou de semi-fixe, crémone simple poignée INT, seuil alu RPT"}]}
Règles pour les cotes : lis l'en-tête de chaque colonne de cotes pour savoir ce qu'elle contient (« TABLEAU », « FABRICATION », « COTES TABLEAU (HT X LG) », « Dos de dormant »…) et dans quel ordre (un « H » devant le premier nombre ou « HT X LG » = hauteur d'abord). Mets toujours la hauteur dans …H et la largeur dans …L. Si la seule colonne est une cote de fabrication ou de dos de dormant, remplis fabH/fabL et laisse tableauH/tableauL vides. Des cotes de fabrication écrites à la main en marge (souvent « H × L ») vont dans fabH/fabL avec "fabSource":"manuscrit" ; en cas de doute sur leur ordre, laisse-les vides. "ofob" vaut "OB" si la colonne OB est cochée, "Fixe" pour un châssis fixe, sinon "OF". "vmc" recopie le contenu de la colonne VMC / « Mortaise + grille VMC » de la ligne (ex. « Standard Brun » ou « oui »), et reste vide si la case est vide ou vaut « - ». La photo peut être tournée de 90° : redresse-la mentalement avant de lire les colonnes, ligne par ligne. "entete" contient exactement ces 7 lignes, dans cet ordre et avec ces libellés : Type de pose (avec le cochonnet et les tapées s'il y en a), Altitude, Section des dormants, Traitement et finition, Jeu (12 ou 4 ; si l'ARC ne précise rien, écris « Jeu : 4 (non précisé sur l'ARC) » car c'est du jeu de 4 par défaut), Quincaillerie (couleur, modèle de poignée), Parcloses (extérieures ou intérieures ; si l'ARC ne précise rien et que c'est du jeu de 4, écris « Parcloses : extérieures (non précisé sur l'ARC) ; châssis fixes et portes d'entrée : intérieures »). Écris « non précisé sur l'ARC » quand l'information n'y est pas. Rien d'autre dans "entete" (pas de délai, prix, livraison ni coordonnées). Si la ligne indique une hauteur d'allège (« HT allège 1130 » ou la colonne HT allège), ajoute \"allege\":1130 (nombre) à la position. Ignore les coulissants (lignes « Coulissant … ») : ne les mets pas dans "positions", ils ne sont pas saisis dans ARCHIMEDE. "type" est UNIQUEMENT une abréviation de l'atelier : porte-fenêtre = « PF » + nombre de vantaux (PF1, PF2) ; fenêtre = « OF » ou « OB » + nombre de vantaux (OF1, OF2, OB1, OB2) ; porte d'entrée = « PE », « PEL1 » pour un modèle à lames L1 (PEL4 pour L4…), « PGV1 » pour un grand vitrage GV1 (PGV3 pour GV3…) ; châssis fixe = « CHAFIX ». "particularites" contient UNIQUEMENT des mots-clés séparés par des virgules, dans cet ordre, et seulement ceux qui s'appliquent : « Ouv. ext. » (ouverture extérieure), la fiche demandée (ANUBA 14, EXACTA 14, EXACTA 16, TRIXACTA, TRIXACTA RENFORCÉE, URSUS), « MR/R » ou « Crémone barillet », le seuil (« PG16 » ou « Seuil alu »), « Allège N » (hauteur d'allège en mm), « PA 003 » ou « PA 103 », « Vitrage provisoire ». Aucune phrase, rien d'autre. "details" recopie en revanche TOUT le texte de la ligne, désignation comprise (type de menuiserie, options, annotations manuscrites) pour le contrôle ultérieur. Ne devine rien : laisse vide ce qui est illisible.`;

  let newFiles = [];
  function newOrderForm(){
    const running = busy && busy.id === 'nouvelle' && !busy.done;
    const num = h('input',{type:'text', id:'new-num', placeholder:'ex. 1035', inputmode:'numeric'});
    const picked = h('p',{class:'picked'}, newFiles.length ? newFiles.length + ' fichier(s) choisi(s) : ' + newFiles.map(f => f.name).join(', ') : 'Aucun fichier choisi.');
    const input = h('input',{type:'file', id:'new-arc', accept:'application/pdf,image/*', multiple:true, hidden:true,
      onchange: ev => { newFiles = [...ev.target.files]; picked.textContent = newFiles.length + ' fichier(s) choisi(s) : ' + newFiles.map(f => f.name).join(', '); go.disabled = !newFiles.length || running; }});

      h('div',{class:'action'},
        h('label',{class:'field'}, 'N° de commande ARCHIMEDE (facultatif)', num),
        h('div',{class:'field'}, "ARC : photo(s) ou PDF", input,
          h('div',{class:'row'}, h('button',{class:'btn ghost', type:'button', onclick:() => input.click()}, "Choisir l'ARC"), picked)),
        h('div',{class:'row'}, go,
          running ? h('button',{class:'btn ghost', type:'button', onclick:() => busy.ctl && busy.ctl.abort()}, 'Arrêter') : null),
        h('p',{class:'status' + (busy && busy.id === 'nouvelle' && busy.err ? ' err' : ''), id:'st-nouvelle', 'aria-live':'polite'},
          busy && busy.id === 'nouvelle' ? busy.status : (!sample ? "La lecture par Claude n'est pas disponible ici. Envoyez l'ARC à Claude dans la conversation." : ''))));

  async function createOrder(num){
    const ctl = new AbortController();
    busy = {id:'nouvelle', ctl, status:'Préparation…', err:false};
    const say = t => { busy.status = t; const el = document.getElementById('st-nouvelle'); if (el){ el.textContent = t; el.className = 'status'; } };
    renderSheet();
    try {
      const per = await imageBudget();
      const imgs = await filesToImages(newFiles, say);
      if (imgs.length > per) throw {code:'image_rejected'};
      say("Claude lit l'ARC…");
      const r = await sample.json(ARC_PROMPT(imgs.length), {images: imgs, signal: ctl.signal, cache:false});
      say('Enregistrement…');
      const fichiers = await keepFiles(newFiles);
      const dim = (a, b) => (a && b) ? S(a) + ' × ' + S(b) : '';
      const rows = (Array.isArray(r && r.positions) ? r.positions : []).map(p => [p.pos, p.ref, p.type, p.ofob, p.sens, p.vmc,
        dim(p.tableauH, p.tableauL), dim(p.fabH, p.fabL) + (p.fabH && p.fabSource === 'manuscrit' ? ' (manuscrit)' : ''), p.qte, p.particularites].map(S));
      const arcDetails = (Array.isArray(r && r.positions) ? r.positions : []).map(p => S(p.details || p.particularites));
      const arc = S(r && r.arc);
      let id = (num || arc.split(' ')[0] || ('c' + Date.now().toString(36))).replace(/[^A-Za-z0-9-]/g,'') || ('c' + Date.now().toString(36));
      while (orders.some(x => x.id === id)) id += '-2';
      const doc = {
        num: num || '', type:'saisie', ordre: Date.now(),
        titreCourt: num ? 'Commande ' + num : 'ARC ' + arc,
        titre: num ? 'Commande ' + num + ' · ARC ' + arc : 'Fiche de saisie : ARC ' + arc,
        meta: ['ARC ' + arc, 'Client ' + S(r.client), [r.projet, r.chantier].filter(Boolean).join(', '), S(r.gamme), rows.length + ' positions'].filter(x => x && !/^(ARC|Client) $/.test(x)).join(' · '),
        arc, client: S(r.client), chantier: [r.projet, r.chantier].filter(Boolean).join(', '), gamme: S(r.gamme),
        entete: (Array.isArray(r.entete) ? r.entete : []).map(S).filter(Boolean),
        positions: {head:['Pos','Réf.','Type','OF/OB','Sens','VMC','Tableau H × L','Fab H × L','Qté','Particularités'], mono:[0,6,7], checkCols:['Saisi','Vérifié'],
          foot:"Sur l'ARC, la hauteur est donnée en premier (H × L).", rows},
        arcFichiers: fichiers, arcDetails,
        signatures:['Saisie le','Vérifiée par','Commande éditée le']
      };
      await db.doc('commandes/' + id).set(doc);
      busy = null; newFiles = [];
      location.hash = 'c-' + id;
    } catch (e){
      busy = {id:'nouvelle', status: e && e.code === 'image_rejected' ? "L'ARC a trop de pages : gardez seulement les pages utiles." : sampleMsg(e), err:true, done:true};
      renderSheet();
    }
  }

  // ---- suppression d'une commande (confirmation dans la page) ----
  function deleteBox(o){
    const label = o.titreCourt || ('Commande ' + o.num);
    if (confirmDel !== o.id){
      return h('div',{class:'del', 'data-noprint':''},
        h('button',{class:'btn ghost danger', type:'button', onclick:() => { confirmDel = o.id; renderSheet(); }}, 'Supprimer la commande'));
    }
    return h('div',{class:'del confirm', 'data-noprint':''},
      h('p',null, h('b',null, 'Supprimer « ' + label + ' » ?'), ' La fiche de saisie, la vérification, vos coches et les fichiers joints seront effacés. Impossible de revenir en arrière.'),
      h('div',{class:'row'},
        h('button',{class:'btn danger-fill', type:'button', onclick: ev => deleteOrder(o, ev.currentTarget)}, 'Oui, supprimer'),
        h('button',{class:'btn ghost', type:'button', onclick:() => { confirmDel = null; renderSheet(); }}, 'Annuler')));
  }
  async function deleteOrder(o, btn){
    btn.disabled = true; btn.textContent = 'Suppression…';
    try {
      await db.doc('commandes/' + o.id).delete();
      await db.doc('etats/' + o.id).delete().catch(() => {});
      if (assets){
        const ids = [...(o.arcFichiers || []), ...((o.verif && o.verif.fichiers) || [])].map(f => f && f.id).filter(Boolean);
        for (const id of ids){ try { await assets.delete(id); } catch (_) { /* fichier déjà absent */ } }
      }
      confirmDel = null;
      $('#saved').textContent = '« ' + (o.titreCourt || o.id) + ' » supprimée.';
      location.hash = '';
      route();
    } catch (e){
      btn.disabled = false; btn.textContent = 'Oui, supprimer';
      $('#saved').textContent = e && e.code === 'invalid_argument'
        ? "Vous n'avez pas le droit de supprimer cette commande."
        : 'La suppression a échoué. Réessayez dans un instant.';
    }
  }

  // ---- impression : PDF A4 de la feuille, coupé entre les blocs ----
  async function exportPdf(o, btn){
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Préparation du PDF…';
    let holder = null;
    try {
      if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const src = document.querySelector('#main .sheet');
      holder = h('div',{class:'pdf'});
      const sheet = src.cloneNode(true);
      // Les champs deviennent du texte imprimé, avec l'état réel de la page (appariés avant tout retrait)
      const live = src.querySelectorAll('input'); const copy = sheet.querySelectorAll('input');
      copy.forEach((inp, i) => {
        const real = live[i];
        if (inp.type === 'checkbox' || inp.type === 'radio') inp.replaceWith(h('span',{class:'box'}, real && real.checked ? 'X' : ''));
        else if (inp.type === 'text') inp.replaceWith(h('span',{class:'val'}, real ? real.value : ''));
        else inp.remove();
      });
      sheet.querySelectorAll('.action,[data-noprint],button').forEach(n => n.remove());
      holder.append(sheet); document.body.append(holder);
      const canvas = await window.html2canvas(holder, {scale:2, backgroundColor:'#ffffff', logging:false});
      // Points de coupe possibles : le haut de chaque bloc
      const base = holder.getBoundingClientRect().top;
      const cuts = [...holder.querySelectorAll('.issue, tr, h3.sec, li, .sign, .entete label, .score, p')]
        .map(n => Math.round(n.getBoundingClientRect().top - base)).sort((a,b) => a-b);
      const W = holder.offsetWidth, H = holder.offsetHeight;
      const {jsPDF} = window.jspdf;
      const pdf = new jsPDF({unit:'mm', format:'a4'});
      const mm = 190 / W, pageH = Math.floor(277 / mm);
      const k = canvas.width / W;
      let y = 0, first = true;
      while (y < H - 2){
        let end = Math.min(H, y + pageH);
        if (end < H){
          const best = cuts.filter(t => t > y + 120 && t <= end).pop();
          if (best) end = best;
        }
        const part = document.createElement('canvas');
        part.width = canvas.width; part.height = Math.round((end - y) * k);
        part.getContext('2d').drawImage(canvas, 0, Math.round(y * k), canvas.width, part.height, 0, 0, canvas.width, part.height);
        if (!first) pdf.addPage();
        pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', 10, 10, 190, (end - y) * mm);
        first = false; y = end;
      }
      const name = 'Controle ' + (o.num ? 'commande ' + o.num : (o.arc ? 'ARC ' + o.arc : o.id)) + '.pdf';
      await downloads.save({filename: name.replace(/[\\/:*?"<>|]/g,''), data: pdf.output('blob')});
      $('#saved').textContent = 'PDF enregistré. Ouvrez-le pour l\'imprimer.';
    } catch (e){
      const c = e && e.code;
      $('#saved').textContent = c === 'declined' ? 'Enregistrement du PDF annulé.'
        : (e && e.message === 'script') ? "Le PDF n'a pas pu être préparé : vérifiez la connexion internet."
        : "Le PDF n'a pas pu être créé. Réessayez dans un instant.";
    } finally {
      if (holder) holder.remove();
      btn.disabled = false; btn.textContent = label;
    }
  }

  function route(){
    if (location.hash === '#nouvelle') current = 'nouvelle';
    else {
      const m = location.hash.match(/^#c-([A-Za-z0-9-]+)$/);
      current = m ? m[1] : (orders[0] && orders[0].id) || null;
    }
    renderList(); renderSheet();
  }
  window.addEventListener('hashchange', route);

  (async () => {
    if (!window.claude){ $('#main').replaceChildren(h('div',{class:'state'}, h('b',null,'Ouvrez cette page depuis claude.ai.'))); return; }
    [db, sample, assets, downloads] = await Promise.all(['db','sample','assets','downloads'].map(n => window.claude.use(n).catch(() => null)));
    if (!db){
      $('#main').replaceChildren(h('div',{class:'state'}, h('b',null,'Les commandes ne peuvent pas être chargées ici.'),
        h('p',null,'Ouvrez cette page depuis claude.ai en étant connecté.')));
      return;
    }
    db.collection('commandes').onSnapshot(snap => {
      // Tri par numéro de commande décroissant (1071 avant 1070) ; sans numéro, à la fin
      const n = o => { const m = S(o.num || o.titreCourt).match(/\d+/); return m ? Number(m[0]) : -Infinity; };
      orders = snap.docs.map(d => Object.assign({id:d.id}, d.data()))
        .sort((a,b) => (n(b) - n(a)) || ((b.ordre||0) - (a.ordre||0)));
      const active = document.activeElement;
      if (active && active.tagName === 'INPUT' && active.type === 'text'){ renderList(); return; }
      route();
    }, () => { $('#main').replaceChildren(h('div',{class:'state'}, h('b',null,'Connexion aux commandes interrompue.'), h('p',null,'Rechargez la page.'))); });
    db.collection('etats').onSnapshot(snap => {
      const active = document.activeElement;
      const typing = active && active.tagName === 'INPUT' && active.type === 'text';
      for (const d of snap.docs) etats[d.id] = d.data();
      renderList();
      if (!typing) renderSheet();
    }, () => {});
  })();
})();
